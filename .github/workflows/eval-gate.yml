name: eval-gate

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "datasets/**"
      - ".github/workflows/eval-gate.yml"

jobs:
  eval-gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eval
          POSTGRES_PASSWORD: eval
          POSTGRES_DB: eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U eval -d eval"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://eval:eval@localhost:5432/eval

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend deps
        working-directory: backend
        run: uv sync

      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Baseline run (main)
        id: baseline
        working-directory: backend
        run: |
          baseline_id=$(uv run python ../scripts/run_eval_slice.py)
          echo "id=$baseline_id" >> "$GITHUB_OUTPUT"
          echo "baseline run id: $baseline_id"

      - name: Candidate run (PR)
        id: candidate
        working-directory: backend
        run: |
          candidate_id=$(uv run python ../scripts/run_eval_slice.py)
          echo "id=$candidate_id" >> "$GITHUB_OUTPUT"
          echo "candidate run id: $candidate_id"

      - name: Diff runs (fail if regressions)
        working-directory: backend
        run: |
          uv run python ../scripts/compare_runs.py \
            ${{ steps.baseline.outputs.id }} \
            ${{ steps.candidate.outputs.id }}